name: Build & Push relay to ECR

on:
  push:
    paths:
      - "apps/relay-server/**"
      - "crates/protocol/**"
      - "crates/shared/**"
      - "crates/transport/**"
      - "infra/docker/Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ecr-relay.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: teleportal-relay

jobs:
  build-and-push:
    name: Build & Push Docker image to AWS ECR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${IMAGE_NAME}" \
            || aws ecr create-repository --repository-name "${IMAGE_NAME}" --image-scanning-configuration scanOnPush=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          SHA_TAG: ${{ github.sha }}
        run: |
          if [ -z "${ECR_REGISTRY}" ]; then
            echo "ECR_REGISTRY secret is required (ex: 123456789012.dkr.ecr.eu-west-1.amazonaws.com)"
            exit 1
          fi
          IMAGE="${ECR_REGISTRY}/${IMAGE_NAME}"
          docker build \
            -f infra/docker/Dockerfile \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${SHA_TAG}" \
            .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${SHA_TAG}"
          echo "Pushed ${IMAGE}:latest and ${IMAGE}:${SHA_TAG}"

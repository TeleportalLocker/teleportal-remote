[workspace]
resolver = "2"
members = [
    "apps/desktop-client/src-tauri",
    "apps/relay-server",
    "crates/capture",
    "crates/input",
    "crates/protocol",
    "crates/transport",
    "crates/video-stream",
    "crates/cursor-sync",
    "crates/updater",
    "crates/shared",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Teleportal"]
repository = "https://github.com/TeleportalLocker/teleportal-remote"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = "0.3"
rand = "0.9"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.26", features = ["connect"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }

teleportal-shared = { path = "crates/shared" }
teleportal-capture = { path = "crates/capture" }
teleportal-input = { path = "crates/input" }
teleportal-protocol = { path = "crates/protocol" }
teleportal-transport = { path = "crates/transport" }
teleportal-video-stream = { path = "crates/video-stream" }
teleportal-cursor-sync = { path = "crates/cursor-sync" }
teleportal-updater = { path = "crates/updater" }

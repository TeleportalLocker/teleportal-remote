services:
  relay:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: teleportal-relay:local
    environment:
      TELEPORTAL_RELAY_BIND: "0.0.0.0:7800"
      TELEPORTAL_SESSION_TTL_SECS: "${TELEPORTAL_SESSION_TTL_SECS:-600}"
      TELEPORTAL_RATE_LIMIT_PER_MIN: "${TELEPORTAL_RATE_LIMIT_PER_MIN:-30}"
    expose:
      - "7800"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - relay
    ports:
      - "${TELEPORTAL_HTTP_PORT:-8080}:8080"
      - "${TELEPORTAL_ACME_HTTP_PORT:-80}:80"
      - "${TELEPORTAL_HTTPS_PORT:-443}:443"
    environment:
      TELEPORTAL_DOMAIN: "${TELEPORTAL_DOMAIN:-}"
      TELEPORTAL_ACME_EMAIL: "${TELEPORTAL_ACME_EMAIL:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

[package]
name = "teleportal-relay-server"
description = "Serveur relay Teleportal Remote (Axum WebSocket)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "teleportal-relay-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
teleportal-protocol = { workspace = true }
teleportal-shared = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
teleportal-transport = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
